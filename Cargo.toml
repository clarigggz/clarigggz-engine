[package]
name = "clarigggz-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "24.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

[features]
default = ["k1"]
k1 = [] # SpacemiT K1 specific optimizations
custom-silicon = [] # Future custom silicon target
